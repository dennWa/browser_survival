<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Map-Editor – Browser Survival</title>
    <link rel="stylesheet" href="editor.css" />
    <!-- Three.js aus dem Spiel (client/vendor, erzeugt von npm run assets:3d) – nur für die 3D-Ansicht -->
    <script type="importmap">
      { "imports": { "three": "../client/vendor/three/three.module.js" } }
    </script>
  </head>
  <body>
    <!-- Kopf: Menüleiste (aus ui/befehlsliste.js) · Zone · Schnellleiste · Speicherstatus -->
    <header id="kopf">
      <a class="logo" href="../client/" title="Zurück zum Spiel">🧟 <b>Map-Editor</b></a>
      <nav id="menue" aria-label="Menü"></nav>
      <label class="zonenwahl" title="Aktive Zone (Entwürfe dieses Projekts)"><span>Zone</span> <select id="zone-wahl"></select></label>
      <div id="schnell" class="gruppe" role="toolbar" aria-label="Schnellzugriff"></div>
      <button id="speicher-status" type="button" title="Lokaler Speicher – Klick speichert sofort"></button>
    </header>

    <div id="haupt">
      <!-- Werkzeugleiste (fest, überdeckt die Karte nicht) -->
      <nav id="werkzeuge" role="toolbar" aria-label="Werkzeuge"></nav>
      <!-- Links: Assets · Prefabs · Zonen · Räume -->
      <aside id="links" class="seitenleiste" aria-label="Assets und Projekt"><div class="reiter" role="tablist"></div><div class="inhalt"></div></aside>
      <main id="mitte">
        <div id="optionen" role="toolbar" aria-label="Werkzeug-Optionen"></div>
        <div id="flaeche">
          <canvas id="leinwand2d" tabindex="0"></canvas>
          <canvas id="leinwand3d" hidden></canvas>
          <div id="hinweis-leer" hidden>Keine Zone geöffnet – <b>Datei → Neue Zone</b> (Rechteck aufziehen) oder <b>Öffnen</b>.</div>
          <div id="knoepfe-3d" hidden>
            <button data-3d="spiel" title="Spielperspektive (Kamera wie im Spiel)">🎮 Spielperspektive</button>
            <button data-3d="oben" title="Von oben">⬇ Von oben</button>
          </div>
          <div id="zoom-knoepfe">
            <button data-befehl="ansicht.zoomRein" title="Hineinzoomen (+)">＋</button>
            <button data-befehl="ansicht.zoomRaus" title="Herauszoomen (−)">－</button>
            <button data-befehl="ansicht.einpassen" title="Ganze Zone (F)">⤢</button>
          </div>
          <!-- Handy-Leiste (7.6, nur ≤ 900 px): Schubladen + Rückgängig + Kontextmenü mit dem Daumen -->
          <div id="handy-leiste" role="toolbar" aria-label="Handy-Leiste">
            <button data-befehl="ansicht.links" title="Assets &amp; Projekt">🧱</button>
            <button data-befehl="bearbeiten.rueckgaengig" title="Rückgängig">↶</button>
            <button data-befehl="bearbeiten.wiederholen" title="Wiederholen">↷</button>
            <button id="handy-mehr" type="button" title="Mehr (wie Rechtsklick)">⋯</button>
            <button data-befehl="ansicht.rechts" title="Inspektor, Ebenen, Prüfung">◨</button>
          </div>
        </div>
      </main>
      <!-- Rechts: Inspektor · Ebenen · Prüfung (+ KI-Import-Vorschau) -->
      <aside id="rechts" class="seitenleiste" aria-label="Inspektor"><div class="reiter" role="tablist"></div><div class="inhalt"></div></aside>
      <!-- KI-Helfer (einklappbar, Strg+J) -->
      <aside id="ki" class="seitenleiste" aria-label="KI-Helfer" hidden><div class="reiter" role="tablist"></div><div class="inhalt"></div></aside>
    </div>

    <footer id="status"><span id="status-koord">–</span><span id="status-info"></span><span id="status-auswahl"></span><button id="status-pruefung" type="button" title="Prüfung anzeigen"></button><span id="status-meldung" role="status" aria-live="polite"></span></footer>

    <div id="dialog-hintergrund" hidden><div id="dialog" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
